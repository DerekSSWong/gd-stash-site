<script>
/* THE SHARED TEXT FILTER, from gd-lib. In the same block as this page's own
   code on purpose: the gates evaluate a script block whole, so an engine in
   its own block would be missing from exactly the contexts that test the
   page. Three pages ran three hand-kept copies of these rules until
   2026-09-09, and the word-order rule reached two of them. */
/* The text filter, once.
 *
 * Three pages run this: the GD Catalogue's four tabs, the Transfer Stash, and
 * GD Lens's affix tab. It existed as three hand-kept copies until 2026-09-09,
 * and the cost was measurable -- the typed-word-order rule reached two of the
 * three and sat unnoticed on the third for three days, because that page's gate
 * drove only single-word probes and order cannot differ with one word.
 *
 * WHAT THIS OWNS: the matching rules, and nothing else. It is handed a list of
 * strings and a query, and answers whether they match and which spans to mark.
 *
 * WHAT IT DOES NOT OWN, on purpose: which strings go in the list. That is the
 * one genuinely per-surface decision -- the catalogue searches computed effect
 * lines, factions and set bonuses, the stash searches the tooltip lines the game
 * itself wrote, GD Lens searches affix rows -- and each page keeps a function
 * producing them. Same boundary that worked for the trigger vocabulary: the
 * library owns the rule, the page owns what it feeds in.
 *
 * The rules, each of which shipped as a bug first:
 *
 *  - PER LINE, never one merged blob. "aether resist" must not match a card
 *    carrying "Aether Damage" on one line and "Cold Resist" on another.
 *  - Words in the ORDER TYPED, not necessarily adjacent. "converted to physical"
 *    is a different query from "physical converted to"; adjacency is NOT
 *    required, because the same stat is phrased with different filler between
 *    the words and requiring it would defeat the synonym expansion.
 *  - damage <-> dmg, expanded per word, and a PREFIX of either half counts as
 *    the whole word already. Without that, typing "damage" letter by letter
 *    shows nothing until the final keystroke and then jumps.
 *  - Apostrophe-insensitive both ways: "deaths" finds "Death's" and vice versa.
 *  - `flat` and `%` are opposed modifiers over the same stat. Any prefix of
 *    "flat" counts, for the same anti-flicker reason.
 *  - AND/OR/NOT rows combine left to right with no precedence. An empty list has
 *    no opinion, so an untouched box never narrows anything.
 *  - Highlight scope follows search scope and does NOT inherit it: a row marks a
 *    line only when that line is the one satisfying the row's whole word set.
 *    Fixing one side alone is a bug all three pages have shipped.
 */
/* GDSearch:begin -- tools/check_page_search.js cuts between these two markers
   to run the conformance cases against the copy a page shipped. It asserts both
   are present, so renaming one fails loudly instead of checking nothing. */
(function (root) {
  'use strict';

  var APOSTROPHE_RE = /['’]/g;
  function stripApostrophes(s) { return String(s).replace(APOSTROPHE_RE, ''); }

  var SYNONYMS = [['damage', 'dmg']];

  function expandTermVariants(text) {
    var variants = {};
    variants[text] = 1;
    SYNONYMS.forEach(function (pair) {
      var a = pair[0], b = pair[1], next = {};
      Object.keys(variants).forEach(function (v) {
        next[v] = 1;
        if (v.indexOf(a) >= 0) next[v.split(a).join(b)] = 1;
        if (v.indexOf(b) >= 0) next[v.split(b).join(a)] = 1;
        // Still mid-word ("dam" on the way to "damage"): treat it as if the full
        // word were already typed, so the result set does not jump on the last key.
        if (a.indexOf(v) === 0) next[b] = 1;
        if (b.indexOf(v) === 0) next[a] = 1;
      });
      variants = next;
    });
    return Object.keys(variants);
  }

  function parseSearchWords(text) {
    var raw = stripApostrophes(String(text).toLowerCase()).split(/\s+/).filter(Boolean);
    var isFlat = function (w) { return w.length > 0 && 'flat'.indexOf(w) === 0; };
    return {
      requireFlat: raw.some(isFlat),
      words: raw.filter(function (w) { return !isFlat(w); }),
    };
  }

  /* Greedy: the EARLIEST occurrence of any of a word's variants at or after the
     previous word's end. Optimal for a subsequence test, since accepting a later
     occurrence can only lose matches; where two variants start at the same index
     the shorter wins, leaving the most room for the words still to place. */
  function wordsInOrder(line, variantsList) {
    var pos = 0;
    for (var i = 0; i < variantsList.length; i++) {
      var at = -1, len = 0, vs = variantsList[i];
      for (var j = 0; j < vs.length; j++) {
        var k = line.indexOf(vs[j], pos);
        if (k < 0) continue;
        if (at < 0 || k < at || (k === at && vs[j].length < len)) { at = k; len = vs[j].length; }
      }
      if (at < 0) return false;
      pos = at + len;
    }
    return true;
  }

  /* A query, parsed once. Callers memoize this per row: a keystroke repaints
     every row and the parse cannot have changed between them. */
  function parseQuery(text) {
    var p = parseSearchWords(text);
    return { requireFlat: p.requireFlat, variants: p.words.map(expandTermVariants) };
  }

  /* Does this ONE line satisfy this parsed query? The predicate both matching
     and highlighting call, so the same-line rule cannot be corrected on one side
     only. `line` must already be lowercased and apostrophe-stripped. */
  function lineMatches(line, q) {
    if (q.requireFlat && line.indexOf('%') >= 0) return false;
    return wordsInOrder(line, q.variants);
  }

  function normalise(s) { return stripApostrophes(String(s).toLowerCase()); }

  /* Any of these lines. `lines` may be raw: normalise() is applied here unless
     the caller says it has already done it, which every page does, since the
     normalised lines are memoized per record. */
  function termMatches(lines, text, alreadyNormalised) {
    var q = parseQuery(text);
    return lines.some(function (l) {
      return lineMatches(alreadyNormalised ? l : normalise(l), q);
    });
  }

  /* AND/OR/NOT rows, left to right, no precedence. Each row's operator applies

/* IAGD's Rarity column is INVERTED against the game's own words: its "Epic" is the
   game's Legendary and its "Blue" is the game's Epic. The item record's own
   itemClassification is the authority, so the page reads `tier` and never `rarity`.
   Confirmed by the export: 131 IAGD-"Epic" items, 131 itemClassification=Legendary. */
function tierOf(it){ return it.tier || ''; }
/* Which of the two kinds a card is. The word is deliberately "In stash" rather
   than "Owned": you own the blueprint too. */
function haveOf(it){ return it.craftable ? 'Craftable' : 'In stash'; }

/* The game's colour codes. ^X opens a colour, ^- closes it; anything unrecognised
   is left as plain text rather than guessed at.
   `ranges` are highlight spans measured on the PLAIN text (codes stripped), which
   is the only coordinate space both sides can agree on: the search reads plain
   text, the render walks the coded one. A run is cut at every range boundary so a
   hit that straddles a colour change still marks in both halves, and the <mark>
   is nested INSIDE the colour span so it paints behind the game's own colour
   rather than over it. */
function colourise(text, ranges){
  var out = document.createDocumentFragment();
  var re = /\^(.)/g, pos = 0, cur = null, m, at = 0;
  var R = ranges || [];
  function emit(s){
    if (!s) return;
    var cuts = [0, s.length];
    R.forEach(function(r){
      if (r[0] > at && r[0] < at + s.length) cuts.push(r[0] - at);
      if (r[1] > at && r[1] < at + s.length) cuts.push(r[1] - at);
    });
    cuts.sort(function(a, b){ return a - b; });
    for (var i = 0; i + 1 < cuts.length; i++){
      if (cuts[i] === cuts[i + 1]) continue;
      var abs = at + cuts[i];
      var n = document.createTextNode(s.slice(cuts[i], cuts[i + 1]));
      if (cur){ var sp = document.createElement('span'); sp.style.color = 'var(--c' + cur + ')'; sp.appendChild(n); n = sp; }
      if (R.some(function(r){ return abs >= r[0] && abs < r[1]; })){
        var mk = document.createElement('mark'); mk.appendChild(n); n = mk;
      }
      out.appendChild(n);
    }
    at += s.length;
  }
  while ((m = re.exec(text)) !== null){
    emit(text.slice(pos, m.index));
    cur = m[1] === '-' ? null : (getComputedStyle(document.documentElement).getPropertyValue('--c' + m[1]) ? m[1] : cur);
    pos = re.lastIndex;
  }
  emit(text.slice(pos));
  return out;
}

/* ---- search ---------------------------------------------------------------
   Ported rule for rule from the catalogue's item_browser_template.html. The two
   pages are read by the same person minutes apart, so a query that works in one
   has to work in the other; what came across, and why each rule exists, is
   documented at length there. In brief:
     - candidates are LINES, never one merged blob. "aether resist" must not
       match a card carrying "Aether Damage" on one line and "Cold Resist" on
       another.
     - typed word ORDER is enforced, adjacency is not.
     - damage <-> dmg, expanded per word, and a PREFIX of either half counts as
       the whole word already, so results don't flicker mid-typing.
     - apostrophe-insensitive in both directions.
     - `%` and `flat` are opposed modifiers over the same stat.
     - AND/OR/NOT rows, combined left to right with no precedence.
     - and highlight marks exactly what the match used and nothing else. Search
       scope and highlight scope move together -- fixing one alone is the bug
       that rule exists for.
   The one thing this page adds is that a candidate line is a TOOLTIP line the
   game itself wrote, carrying ^X colour codes; they are stripped before any of
   it, since a code is not a word anyone types. */
/* The matching rules are gd-lib's search.js, spliced in above. What stays here
   is the one per-surface decision -- which of a card's lines go in front of the
   matcher, which for this page means the tooltip lines the GAME wrote, minus
   flavour text and set member names -- plus this page's own span marking, which
   works by apostrophe-tolerant regex over the real coded text. */
var stripApostrophes = GDSearch.stripApostrophes;

var CODE_RE = /\^./g;
function plain(s){ return s.replace(CODE_RE, ''); }
function lineClassOf(code){ return LINE_CLASS[code] || 'stat'; }
/* Flavour text is out of search scope, the same exclusion the catalogue makes
   for `quote` -- and because it is unsearched it is also unmarked. Both or
   neither: "this field isn't part of search" is one promise to the reader. */
var UNSEARCHABLE = { flav: 1 };
/* Set MEMBER NAMES are out too, and for the catalogue's exact reason: the
   tooltip repeats every piece of a set on every sibling's card, so searching one
   piece's name returned the whole set. The set NAME (kind 21) and the tier bonus
   lines stay IN scope, so searching "Cinderborn" still returns all four pieces.
   IAGD writes the member names and the "(N) Set" tier headers as the same kind,
   and across this export the headers are the only ones carrying that shape --
   93 headers, 133 member names, and no kind-23 line at all on an item with no
   set. Anything else at that kind is treated as a member name, which fails
   toward LESS search scope rather than toward a wrong hit. */
var SET_MEMBER_CODE = 23;
var SET_TIER_RE = /^\(\d+\)/;
function searchableLine(L){
  if (UNSEARCHABLE[lineClassOf(L[0])]) return false;
  if (L[0] === SET_MEMBER_CODE && !SET_TIER_RE.test(plain(L[1]))) return false;
  return true;
}

// "flat" is a modifier, not a word to find: it means "a line for the remaining
// words that is NOT a percentage". Typing "%" already isolates the percentage
// form; this is its counterpart. Any prefix of "flat" counts as the whole word,
// for the same anti-flicker reason the synonyms do.
// Words must appear in the ORDER TYPED, not necessarily adjacent. The scan is
// greedy -- earliest occurrence of any variant at or after the previous word's
// end -- which is optimal for a subsequence test, and where two variants start
// at the same index the shorter wins, leaving the most room for what follows.
// termMatches() and markRanges() BOTH call this rather than restating it.
// The candidate lines: one per searchable tooltip line, plus the slot, which is
// the one thing the card shows as a word that the tooltip does not.
// `it.set` is NOT among them -- it holds a lootset DBR PATH, not the set's name,
// so it would put "records", "lootsets" and "itemset_c021b" into search and
// match every set piece at once. The set's NAME is already a searchable tooltip
// line of its own (kind 21), which is what the catalogue searches too.
// Cached per item: the candidate set never changes, only the query.
function candidates(it){
  if (it._lines === undefined){
    var out = [it.name, it.slot];
    it.lines.forEach(function(L){ if (searchableLine(L)) out.push(L[1]); });
    it._lines = out.map(function(s){
      return stripApostrophes(plain(String(s)).toLowerCase());
    });
  }
  return it._lines;
}


function termMatches(it, text){
  // candidates() already lowercased and apostrophe-stripped every line.
  return GDSearch.termMatches(candidates(it), text, true);
}
// Rows combine left to right with no precedence: AND -> r && m, OR -> r || m,
// NOT -> r && !m. An all-empty list has no opinion.
function passesSearch(it){
  // Through candidates(it) -- the one place this page decides what the matcher
  // sees. Sabotaging that list must change what the page returns, which is what
  // the negative control aims at.
  return GDSearch.rowsMatch(candidates(it), state.rows, true);
}
// Highlight spans for ONE plain line. A row only marks in a line that line
// itself satisfies -- the same wordsInOrder() the match used -- so "aether
// resist" never lights "resist" on an unrelated Cold Resist line. NOT rows mark
// nothing: they are why a card is present, not what was found in it.
function markRanges(text){
  var lower = stripApostrophes(text.toLowerCase());
  var terms = [];
  state.rows.forEach(function(r){
    var t = r.text.trim();
    if (!t || r.op === 'NOT') return;
    // The SAME predicate the match used, shared rather than restated.
    var q = GDSearch.parseQuery(t);
    if (!GDSearch.lineMatches(lower, q)) return;
    q.variants.forEach(function(vs){ terms = terms.concat(vs); });
  });
  if (!terms.length) return [];
  // The terms are apostrophe-stripped but `text` still has its real apostrophe,
  // so a plain "deaths" pattern would not find "Death's". Splicing an optional
  // apostrophe between every character matches either way -- the same
  // term<->text equivalence the boolean side gets by stripping both.
  var escRe = function(s){ return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); };
  var tol = function(s){ return s.split('').map(escRe).join("['’]?"); };
  var re = new RegExp('(' + terms.map(tol).join('|') + ')', 'gi');
  var out = [], m;
  while ((m = re.exec(text)) !== null){
    if (!m[0].length){ re.lastIndex++; continue; }
    out.push([m.index, m.index + m[0].length]);
  }
  return out;
}

function el(tag, cls, txt){
  var e = document.createElement(tag);
  if (cls) e.className = cls;
  if (txt !== undefined) e.textContent = txt;
  return e;
}

function card(it){
  var c = el('div', 'card ' + tierOf(it).toLowerCase() + (it.craftable ? ' craftable' : ''));
  if (it.craftable){
    var tag = el('span', 'craftable-tag', 'craftable');
    tag.title = 'You have this blueprint. This item is not in your stash.';
    c.appendChild(tag);
  }
  var box = el('div', 'lines');
  it.lines.forEach(function(L){
    var cls = lineClassOf(L[0]);
    var line = el('div', 'l ' + cls);
    // The kind, on the element. Several kinds share one class -- an item's own
    // name and a set member's are both `nm` -- so the class cannot say whether a
    // line is in search scope, and a gate checking where marks land needs to.
    line.dataset.k = L[0];
    // An unsearchable line is unhighlightable, and gets `null` rather than an
    // empty range list so that stays a statement rather than a coincidence.
    line.appendChild(colourise(L[1], searchableLine(L) ? markRanges(plain(L[1])) : null));
    box.appendChild(line);
  });
  c.appendChild(box);
  // The count goes on the CARD, not in the lines box -- see .dup in the CSS.
  // The title says what the number means, because "×3" alone reads as three
  // identical items and these are three different rolls of one name.
  if (it.dupes > 1){
    c.classList.add('has-dup');
    var dup = el('span', 'dup', '×' + it.dupes);
    dup.title = it.dupes + ' items share this name. The lines shown are the '
              + 'best-rolled one of them, judged against the others; the rest '
              + 'rolled lower numbers and are not on the page.';
    c.appendChild(dup);
  }
  var meta = el('div', 'meta');
  meta.appendChild(el('span', 'lv', 'Lv ' + it.level));
  // The slot is SEARCHED, so it is HIGHLIGHTED. It is the only searchable thing
  // on the card that is not a tooltip line, and leaving it marked-less would
  // split the one promise these two scopes make together.
  var slot = el('span');
  slot.dataset.k = 'slot';
  slot.appendChild(colourise(it.slot, markRanges(it.slot)));
  meta.appendChild(slot);
  if (it.set) meta.appendChild(el('span', null, 'set'));
  if (it.stack > 1) meta.appendChild(el('span', 'stack', '×' + it.stack));
  c.appendChild(meta);
  return c;
}

// `rows[0]` is the always-visible box; rows 1+ are the added AND/OR/NOT terms.
// Row 0 has an op too, and it is never read -- the first row is the seed of the
// left-to-right fold, not an operand of it.
var state = { rows:[{ op:'AND', text:'' }], rarity:{}, slot:{}, set:{}, mastery:{}, have:{}, sort:'level', dir:'desc' };

function anyOn(o){ for (var k in o) if (o[k]) return true; return false; }

function visible(){
  return ITEMS.filter(function(it){
    if (anyOn(state.rarity) && !state.rarity[tierOf(it)]) return false;
    if (anyOn(state.slot) && !state.slot[it.slot]) return false;
    if (anyOn(state.set)){
      var k = it.set ? 'Set piece' : 'Standalone';
      if (!state.set[k]) return false;
    }
    // In the stash, or a blueprint you have unlocked. Two answers to "do I have
    // this", and the whole reason both kinds share one list.
    if (anyOn(state.have) && !state.have[haveOf(it)]) return false;
    // Array-valued, unlike every other bucket: an item that boosts two
    // masteries answers to either chip. `some` over an EMPTY list is false, so
    // an item with no skill bonus drops out as soon as any mastery is pressed,
    // which is what pressing one asks for.
    if (anyOn(state.mastery) && !it.masteries.some(function(m){ return state.mastery[m]; }))
      return false;
    return passesSearch(it);
  });
}

/* FIELD AND DIRECTION ARE SEPARATE, so either field sorts either way. They were
   one control with the direction baked into the option text ("Level, highest
   first"), which meant level could only ever be read one way and every new
   direction would have doubled the list.

   ⚠️ NAME IS ALWAYS THE TIE-BREAK, AND ALWAYS ASCENDING. Level puts dozens of
   items on the same number, and a tie broken by whatever order the export
   happened to arrive in makes the list reshuffle for no visible reason between
   builds. The tie-break does NOT follow the direction: reversing the sort is
   meant to reverse the levels, not to scramble the names inside each one. */
var SORT_KEYS = {
  name: function(a, b){ return a.name.localeCompare(b.name); },
  level: function(a, b){ return a.level - b.level; },
};
function sortRows(rows){
  var key = SORT_KEYS[state.sort] || SORT_KEYS.name;
  var sign = state.dir === 'asc' ? 1 : -1;
  return rows.sort(function(a, b){
    return sign * key(a, b) || a.name.localeCompare(b.name);
  });
}

function render(){
  var rows = sortRows(visible());
  var grid = document.getElementById('grid');
  grid.textContent = '';
  if (!rows.length){
    grid.appendChild(el('div', 'empty', 'No item matches these filters.'));
  } else {
    var frag = document.createDocumentFragment();
    rows.forEach(function(it){ frag.appendChild(card(it)); });
    grid.appendChild(frag);
  }
  document.getElementById('bar').textContent =
    rows.length === ITEMS.length ? ITEMS.length + ' items'
                                 : rows.length + ' of ' + ITEMS.length + ' items';
}

// Every chip button, so clearing can un-press them. A chip's pressed state lives
// in two places -- the state bucket and the button's aria-pressed -- and resetting
// only the bucket leaves the bar claiming filters that are no longer applied.
var CHIPS = [];
function chipRow(host, values, bucket){
  values.forEach(function(v){
    var b = el('button', 'chip');
    b.type = 'button';
    b.setAttribute('aria-pressed', 'false');
    b.appendChild(el('span', null, v[0]));
    b.appendChild(el('span', 'n', String(v[1])));
    b.addEventListener('click', function(){
      bucket[v[0]] = !bucket[v[0]];
      b.setAttribute('aria-pressed', String(!!bucket[v[0]]));
      render();
    });
    host.appendChild(b);
    CHIPS.push([b, bucket, v[0]]);
  });
}

function tally(fn, keep){
  var m = {};
  ITEMS.forEach(function(it){
    if (keep && !keep(it)) return;
    var k = fn(it); m[k] = (m[k] || 0) + 1;
  });
  return Object.keys(m).sort(function(a, b){ return m[b] - m[a]; }).map(function(k){ return [k, m[k]]; });
}

chipRow(document.getElementById('fr'), tally(tierOf), state.rarity);
chipRow(document.getElementById('fs'), tally(function(it){ return it.slot; }), state.slot);
chipRow(document.getElementById('fset'), tally(function(it){ return it.set ? 'Set piece' : 'Standalone'; }), state.set);
chipRow(document.getElementById('fhave'), tally(haveOf), state.have);

// The masteries read in the game's own class order, not by count: it is a fixed
// list of ten the player already knows the order of, and re-sorting it by how
// this particular stash happened to fall makes it slower to scan, not faster.
// A mastery no item in the stash touches is dropped rather than shown at zero.
function tallyList(fn, order){
  var m = {};
  ITEMS.forEach(function(it){ fn(it).forEach(function(k){ m[k] = (m[k] || 0) + 1; }); });
  return order.filter(function(k){ return m[k]; }).map(function(k){ return [k, m[k]]; });
}
chipRow(document.getElementById('fm'),
        tallyList(function(it){ return it.masteries; }, MASTERIES), state.mastery);

// Extra term rows. Rebuilt wholesale on add/remove rather than patched, so the
// data-index every handler closes over cannot drift from the array it indexes.
var srowsEl = document.getElementById('srows');
function renderRows(){
  srowsEl.textContent = '';
  state.rows.slice(1).forEach(function(row, i){
    var idx = i + 1;
    var d = el('div', 'srow');
    var sel = el('select', 'op');
    ['AND', 'OR', 'NOT'].forEach(function(op){
      var o = el('option', null, op);
      o.value = op;
      if (row.op === op) o.selected = true;
      sel.appendChild(o);
    });
    sel.addEventListener('change', function(){ state.rows[idx].op = sel.value; render(); });
    var inp = document.createElement('input');
    inp.type = 'text'; inp.value = row.text;
    inp.placeholder = 'Add term…'; inp.autocomplete = 'off';
    inp.addEventListener('input', function(){ state.rows[idx].text = inp.value; render(); });
    var rm = el('button', 'rm', '×');
    rm.type = 'button';
    rm.title = 'Remove term';
    rm.setAttribute('aria-label', 'Remove term');
    rm.addEventListener('click', function(){ state.rows.splice(idx, 1); renderRows(); render(); });
    d.appendChild(sel); d.appendChild(inp); d.appendChild(rm);
    srowsEl.appendChild(d);
  });
}
renderRows();

document.getElementById('addterm').addEventListener('click', function(){
  state.rows.push({ op: 'AND', text: '' });
  renderRows();
  var ins = srowsEl.querySelectorAll('input');
  if (ins.length) ins[ins.length - 1].focus();
});
var qEl = document.getElementById('q');
qEl.addEventListener('input', function(e){ state.rows[0].text = e.target.value; render(); });

// The filter panel. `hidden` is set here as well as in the markup: the attribute
// is what collapses the panel before this script runs, the property is what the
// toggle reads and writes afterwards.
var fexp = document.getElementById('fexp'), fmore = document.getElementById('fmore');
fexp.hidden = true;
fmore.setAttribute('aria-expanded', 'false');
fmore.addEventListener('click', function(){
  fexp.hidden = !fexp.hidden;
  fmore.setAttribute('aria-expanded', String(!fexp.hidden));
});

// Clear resets what FILTERS, and only that. Sort is an ordering of whatever
// survives, so clearing it would change the list for a reason the user did not
// ask about and cannot see from the bar.
document.getElementById('fclear').addEventListener('click', function(){
  state.rows = [{ op: 'AND', text: '' }];
  CHIPS.forEach(function(c){ c[1][c[2]] = false; c[0].setAttribute('aria-pressed', 'false'); });
  qEl.value = '';
  renderRows();
  render();
});
document.getElementById('sort').addEventListener('change', function(e){ state.sort = e.target.value; render(); });
document.getElementById('sortdir').addEventListener('change', function(e){ state.dir = e.target.value; render(); });

/* Four bars: how much of the game you have, and how much of it you could make.
   `have` counts DISTINCT NAMES, not rows -- three rolls of one sword are one
   thing you have -- and the totals count distinct names in the database for the
   same reason. The two halves are coloured differently because they answer
   different questions: one is a holding, the other an offer. */
var t = document.getElementById('totals');
PROGRESS.forEach(function(b){
  var pct = b.total ? Math.min(100, b.have / b.total * 100) : 0;
  var row = el('div', 'prog' + (b.kind === 'blueprints' ? ' bp' : ''));
  row.appendChild(el('span', 'lab', b.label + (b.kind === 'blueprints' ? ' blueprints' : ' found')));
  var track = el('div', 'track');
  var fill = el('div', 'fill');
  fill.style.width = pct.toFixed(1) + '%';
  track.appendChild(fill);
  row.appendChild(track);
  row.appendChild(el('span', 'num', b.have + ' / ' + b.total));
  // The two bars PARTITION the tier, so the tooltip has to say which half each
  // one is measuring: "of the N items in the game" would be false on both now.
  row.title = b.kind === 'blueprints'
    ? b.have + ' of the ' + b.total + ' craftable ' + b.label
      + ' armour and weapons, blueprint unlocked'
    : b.have + ' of the ' + b.total + ' ' + b.label
      + ' items you cannot craft, found';
  t.appendChild(row);
});

render();

// Test hook. tools/check_stash_search.js drives real queries through the SAME
// state the UI writes and recounts against its own reference -- the failure mode
// of every rule above is extra or missing results, never an error, so nothing
// but a driven query can see a regression.
window.__gdStash = {
  ITEMS: ITEMS, state: state, render: render, renderRows: renderRows,
  passesSearch: passesSearch, termMatches: termMatches, candidates: candidates,
  cards: function(){
    var kids = document.getElementById('grid').children, n = 0;
    for (var i = 0; i < kids.length; i++)
      if (String(kids[i].className || '').indexOf('card') === 0) n++;
    return n;
  },
  // Every marked run, tagged with the line KIND it sits in -- that is what lets
  // the gate assert marks land only on lines the match was allowed to use.
  // childNodes, not children: a real DOM's `children` skips the text nodes the
  // marked runs ARE.
  // Each marked run comes back as [kind, whole line text, marked text]. The KIND
  // and the LINE, not a verdict: the page saying "this line was in scope" would
  // be the page grading its own homework, so the gate re-decides scope from the
  // same two things searchableLine() decides it from.
  marks: function(){
    var out = [];
    function walk(node, kind, line, marked){
      if (node.dataset && node.dataset.k !== undefined){
        // Line kinds are the game's own numeric codes; the slot label is not a
        // line and carries the string 'slot'. Coercing every kind with + turned
        // that one into NaN, and NaN compares false against both the flavour
        // codes and SET_MEMBER_CODE -- so a slot mark passed every scope test
        // without any of them ever looking at it.
        var dk = node.dataset.k;
        kind = /^[0-9]+$/.test(dk) ? +dk : dk;
        line = node.textContent;
      }
      if (node.tagName === 'MARK') marked = true;
      var kk = node.childNodes || [];
      if (!kk.length){ if (marked && node.textContent) out.push([kind, line, node.textContent]); return; }
      for (var i = 0; i < kk.length; i++) walk(kk[i], kind, line, marked);
    }
    walk(document.getElementById('grid'), null, '', false);
    return out;
  },
};
</script>
